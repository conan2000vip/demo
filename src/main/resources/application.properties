spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/healthlog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 起動時にSpring SessionがDBへテーブルを自動作成することを許可
spring.session.jdbc.initialize-schema=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernateの統計情報を有効化して、SQLクエリの実行回数や時間などを測定する
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.SQL=debug

spring.mail.host=localhost
spring.mail.port=1025

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=no-reply@healthlog.local
app.frontend-url=http://localhost:8081
server.port=8081

# cài đặt để đo lường và giám sát ứng dụng bằng Spring Boot Actuator và Prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Cấu hình nén dữ liệu để giảm băng thông và cải thiện hiệu suất
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json