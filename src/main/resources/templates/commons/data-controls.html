<html xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- 期間フィルターを表示するバー -->
    <div th:fragment="dateRangePicker(actionUrl, clearUrl, filterStartDate, filterEndDate)" class="chart-range-picker">
        <button type="button" class="chart-range-picker__toggle" id="chartRangeToggle" aria-expanded="false"
            aria-controls="chartRangePopover">
            <svg class="chart-range-picker__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8" />
                <path d="M16 3v4M8 3v4M3 10h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <span id="chartRangeLabel">期間を選択</span>
            <svg class="chart-range-picker__chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
        <form class="chart-range-picker__popover" id="chartRangePopover" th:action="${actionUrl}" method="get" hidden>
            <div class="chart-range-picker__presets" id="chartRangeQuickBar">
                <button type="button" class="quick-btn" data-range="1D">1日</button>
                <button type="button" class="quick-btn" data-range="1W">7日</button>
                <button type="button" class="quick-btn" data-range="30D">1ヶ月</button>
                <button type="button" class="quick-btn" data-range="6M">6ヶ月</button>
                <button type="button" class="quick-btn" data-range="1Y">1年</button>
            </div>
            <div class="chart-range-picker__dates">
                <label>
                    <span>開始日</span>
                    <input type="date" name="startDate" id="chartRangeStartDate" th:value="${filterStartDate}"
                        th:max="${T(java.time.LocalDate).now()}" />
                </label>
                <label>
                    <span>終了日</span>
                    <input type="date" name="endDate" id="chartRangeEndDate" th:value="${filterEndDate}"
                        th:max="${T(java.time.LocalDate).now()}" />
                </label>
            </div>
            <p class="chart-range-picker__error" id="chartRangeError" role="alert" hidden></p>
            <div class="chart-range-picker__actions">
                <a class="chart-range-picker__clear" th:href="${clearUrl}"
                    th:if="${filterStartDate != null or filterEndDate != null}">リセット</a>
                <button type="submit" class="chart-range-picker__search"><i
                        data-lucide="search"></i><span>検索</span></button>
            </div>
        </form>
    </div>

    <!-- フィードバック一覧を表示するセクション -->
    <section th:fragment="feedbackList(feedbackList)" class="feedback-list" id="feedbackSection"
        th:if="${feedbackList != null and not #lists.isEmpty(feedbackList)}">
        <div class="feedback-card" th:each="fb, iterStat : ${feedbackList}"
            th:classappend="${' feedback-card--' + fb.level.cssClass + (iterStat.index >= 3 ? ' is-hidden' : '')}">
            <div class="feedback-card__content">
                <div class="feedback-card__title" th:text="${fb.title}">急激な体重変化があります</div>
                <div class="feedback-card__message" th:text="${fb.message}">前回比で-2.1kgの変化がありました。</div>
            </div>
            <div class="feedback-card__meta">
                <span class="feedback-card__time" th:text="${#temporals.format(fb.occurredAt, 'M/d HH:mm')}">7/10
                    16:20</span>
                <span class="feedback-card__badge" th:text="${fb.level.label}">重要</span>
            </div>
        </div>
        <button type="button" class="feedback-list__toggle" id="feedbackToggleBtn"
            th:if="${feedbackList != null and #lists.size(feedbackList) > 3}"
            th:text="${'今日のフィードバックをすべて見る（' + #lists.size(feedbackList) + '件）'}">
            今日のフィードバックをすべて見る
        </button>
    </section>

    <!-- データグラフを表示するカード -->
    <section
        th:fragment="chartCard(title, canvasId, hasData, chartUrl, category, iconSrc, seriesLabel, targetText, filterAction, clearUrl, filterStartDate, filterEndDate)"
        class="chart-card" th:classappend="'chart-card--' + ${category}" th:if="${hasData}"
        th:attr="data-chart-url=${chartUrl}">
        <div class="chart-card__header">
            <span class="chart-card__icon">
                <img th:src="${iconSrc}" alt="" class="chart-card__icon-img" />
            </span>
            <h2 th:text="${title}">グラフ</h2>

            <div th:replace="~{commons/data-controls :: dateRangePicker(
				${filterAction}, ${clearUrl}, ${filterStartDate}, ${filterEndDate})}"></div>

            <div class="chart-legend" th:if="${seriesLabel != null}">
                <div class="chart-legend__item">
                    <span class="chart-legend__marker chart-legend__marker--series"></span>
                    <span th:text="${seriesLabel}">体重</span>
                </div>
                <div class="chart-legend__item" th:if="${targetText != null}">
                    <span class="chart-legend__marker chart-legend__marker--target"></span>
                    <span>目標</span>
                    <strong th:text="${targetText}">50.0 kg</strong>
                </div>
            </div>
        </div>
        <div class="chart-card__body" id="chartWrapper">
            <div class="chart-card__canvas">
                <canvas th:id="${canvasId}"></canvas>
            </div>
        </div>
    </section>

    <!-- ページネーション -->
    <nav th:fragment="pagination(baseUrl, startDate, endDate, currentPage, totalPages, hasPrevious, hasNext)"
        class="pagination" th:if="${totalPages > 1}">
        <a th:if="${hasPrevious}"
            th:href="@{${baseUrl}(startDate=${startDate}, endDate=${endDate}, page=${currentPage - 1})}"
            class="pagination__nav">← 前へ</a>

        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:href="@{${baseUrl}(startDate=${startDate}, endDate=${endDate}, page=${i})}" th:text="${i + 1}"
            th:classappend="${i == currentPage} ? 'is-active'" class="pagination__page"></a>

        <a th:if="${hasNext}"
            th:href="@{${baseUrl}(startDate=${startDate}, endDate=${endDate}, page=${currentPage + 1})}"
            class="pagination__nav">次へ →</a>
    </nav>
</body>

</html>
