<!DOCTYPE html>
<html lang="ja" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthLog - 確認コード</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">

            <!-- 左側パネル：ブランド情報とイラスト（他の画面と共通） -->
            <aside class="auth-brand">
                <div class="auth-brand__logo">
                    <img th:src="@{/images/logo.png}" alt="HealthLog" />
                    <span>HealthLog</span>
                </div>

                <div class="auth-brand__art">
                    <svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="150" cy="150" r="120" fill="#FFFFFF" opacity="0.12" />
                        <circle cx="150" cy="150" r="90" fill="#FFFFFF" opacity="0.10" />
                        <rect x="80" y="110" width="140" height="95" rx="10" fill="#FFFFFF" opacity="0.95" />
                        <path d="M85 118 L150 165 L215 118" stroke="#4657E9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                        <circle cx="205" cy="95" r="24" fill="#22C55E" />
                        <path d="M195 95 L202 103 L217 87" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                    </svg>
                </div>

                <div class="auth-brand__copy">
                    <h2>安心のセキュリティで、<br />家族の情報を守る。</h2>
                    <p>確認コードでご本人確認を行い、大切な健康情報を安全に管理します。</p>
                    <div class="auth-brand__dots">
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </aside>

            <!-- 右側パネル：確認コード入力 -->
            <section class="auth-form-panel">
                <div class="auth-form-panel__header">
                    <h1 th:text="${isResetFlow} ? 'パスワードの再設定' : 'メールアドレスの確認'"></h1>
                    <p>
                        <strong class="email-highlight" th:text="${maskedEmail}"></strong> 宛に6桁の確認コードを送信しました。<br />
                        メールを確認し、下の欄にコードを入力してください。
                    </p>
                </div>

                <form id="verifyForm" th:action="@{/auth/verify-code}" th:object="${verifyCodeRequest}" method="post" class="form" novalidate>
                    <input type="hidden" th:field="*{email}" />

                    <div class="otp-row">
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                    </div>
                    <input type="hidden" id="codeCombined" th:field="*{code}" />

                    <div id="codeError" class="field-error" th:classappend="${errorMessage != null} ? 'is-visible'">
                        <i data-lucide="alert-circle"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <button class="submit-btn" type="submit">認証する</button>
                </form>

                <div class="otp-meta" style="margin-top: 16px; justify-content: center; gap: 8px;">
                    <button type="button" id="resendBtn" class="otp-resend" disabled>コードを再送する</button>
                    <span id="resendTimerText"></span>
                </div>

                <a class="back-link" th:href="@{/auth/login}">
                    <i data-lucide="arrow-left"></i>
                    <span>ログインに戻る</span>
                </a>
            </section>
        </div>
    </div> 

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/verify-code.js}"></script>
</body>

</html>
