<!DOCTYPE html>
<html lang="ja" xmlns:th="http://thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthLog - 新しいパスワード</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <aside class="auth-brand">
        <div class="auth-brand__logo">
          <img th:src="@{/image/logo.png}" alt="HealthLog" />
          <span>HealthLog</span>
        </div>

        <div class="auth-brand__art">
          <svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="150" cy="150" r="120" fill="#FFFFFF" opacity="0.12" />
            <circle cx="150" cy="150" r="90" fill="#FFFFFF" opacity="0.10" />
            <rect x="115" y="150" width="70" height="55" rx="10" fill="#FFFFFF" />
            <path d="M128 150 V128 a22 22 0 0 1 44 0" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" />
            <circle cx="150" cy="175" r="7" fill="#4657E9" />
            <rect x="147" y="178" width="6" height="14" rx="3" fill="#4657E9" />
            <circle cx="205" cy="115" r="22" fill="#22C55E" />
            <path d="M195 115 L202 123 L217 105" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
        </div>

        <div class="auth-brand__copy">
          <h2>もう少しで<br />完了です。</h2>
          <p>安全のため、他のサービスと違うパスワードの設定をおすすめします。</p>
          <div class="auth-brand__dots">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </aside>
      <section class="auth-form-panel">
        <div class="auth-form-panel__header">
          <h1>新しいパスワードを設定</h1>
          <p>確認が完了しました。新しいパスワードを入力してください。</p>
        </div>
        <div class="banner banner--error" th:if="${errorMessage}">
          <i data-lucide="alert-circle"></i>
          <span th:text="${errorMessage}"></span>
        </div>

        <form id="resetPasswordForm" th:action="@{/auth/reset-password}" th:object="${passwordResetConfirmRequest}" method="post" class="form" novalidate>
          <input type="hidden" name="email" th:value="${email}" />
          <div class="input-group">
            <label for="newPassword">新しいパスワード</label>
            <div class="input-box">
              <i data-lucide="lock"></i>
              <input id="newPassword" th:field="*{newPassword}" type="password" placeholder="8文字以上で入力" autocomplete="new-password" />
              <button type="button" class="toggle-password" data-target="newPassword" aria-label="パスワードを表示">
                <i data-lucide="eye"></i>
              </button>
            </div>
            <div id="newPasswordError" class="field-error" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-visible'">
              <i data-lucide="alert-circle"></i>
              <span th:text="${#fields.hasErrors('newPassword')} ? ${#fields.errors('newPassword')[0]} : ''"></span>
            </div>
          </div>
          <div class="input-group">
            <label for="confirmPassword">新しいパスワード（確認）</label>
            <div class="input-box">
              <i data-lucide="lock"></i>
              <input id="confirmPassword" th:field="*{confirmPassword}" type="password" placeholder="もう一度入力してください" autocomplete="new-password" />
              <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="パスワードを表示">
                <i data-lucide="eye"></i>
              </button>
            </div>
            <div id="confirmPasswordError" class="field-error" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-visible'">
              <i data-lucide="alert-circle"></i>
              <span th:text="${#fields.hasErrors('confirmPassword')} ? ${#fields.errors('confirmPassword')[0]} : ''"></span>
            </div>
          </div>

          <button class="submit-btn" type="submit">
            <i data-lucide="check-circle"></i>
            パスワードを更新する
          </button>
        </form>

        <a class="back-link" th:href="@{/auth/login}">
          <i data-lucide="arrow-left"></i>
          <span>ログインに戻る</span>
        </a>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/reset-password.js}"></script>
</body>

</html>
