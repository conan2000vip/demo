<!DOCTYPE html>
<html lang="ja" xmlns:th="http://thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthLog - パスワードをお忘れですか</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <aside class="auth-brand">
        <div class="auth-brand__logo">
          <img th:src="@{/image/logo.png}" alt="HealthLog" />
          <span>HealthLog</span>
        </div>

        <div class="auth-brand__art">
          <svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="150" cy="150" r="120" fill="#FFFFFF" opacity="0.12" />
            <circle cx="150" cy="150" r="90" fill="#FFFFFF" opacity="0.10" />
            <rect x="115" y="150" width="70" height="55" rx="10" fill="#FFFFFF" />
            <path d="M128 150 V128 a22 22 0 0 1 44 0 V150" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" />
            <circle cx="150" cy="175" r="7" fill="#4657E9" />
            <rect x="147" y="178" width="6" height="14" rx="3" fill="#4657E9" />
          </svg>
        </div>

        <div class="auth-brand__copy">
          <h2>安心のセキュリティで、<br />家族の情報を守る。</h2>
          <p>登録済みのメールアドレスに確認コードをお送りします。</p>
          <div class="auth-brand__dots">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </aside>
      <section class="auth-form-panel">
        <div class="auth-form-panel__header">
          <h1>パスワードをお忘れですか？</h1>
          <p>登録済みのメールアドレスを入力してください。確認コードをお送りします。</p>
        </div>
        <div class="banner banner--error" th:if="${errorMessage}">
          <i data-lucide="alert-circle"></i>
          <span th:text="${errorMessage}"></span>
        </div>
        <div class="banner banner--success" th:if="${message}">
          <span th:text="${message}"></span>
        </div>
        <form id="forgotPasswordForm" th:action="@{/auth/forgot-password}" method="post" class="form" novalidate>
          <input type="hidden" name="returnTo" th:value="${returnTo}" />

          <div class="input-group">
            <label for="email">メールアドレス</label>
            <div class="input-box">
              <i data-lucide="mail"></i>
              <input id="email" name="email" type="email" th:value="${email}" placeholder="you@example.com" autocomplete="email" autofocus />
            </div>
            <div id="emailError" class="field-error">
              <i data-lucide="alert-circle"></i>
              <span></span>
            </div>
          </div>

          <button class="submit-btn" type="submit">
            <i data-lucide="send"></i>
            確認コードを送る
          </button>
        </form>

        <a class="back-link" th:href="${returnTo != null and !#strings.isEmpty(returnTo)} ? ${returnTo} : @{/auth/login}">
          <i data-lucide="arrow-left"></i>
          <span>ログインに戻る</span>
        </a>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script th:src="@{/js/common.js}"></script>
</body>

</html>
